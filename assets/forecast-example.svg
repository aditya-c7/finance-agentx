<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative 90-day cash-flow forecast</title>
  <desc id="desc">A line graph comparing a full payment scenario, installment scenario, and safety buffer over 90 days.</desc>
  <rect width="1200" height="520" rx="20" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="464" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="72" y="78" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Illustrative 90-day cash-flow forecast</text>
  <text x="72" y="108" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">Compare projected balance against a configured safety buffer before committing to a purchase.</text>
  <g stroke="#30363d" stroke-width="1">
    <line x1="112" y1="154" x2="112" y2="422"/>
    <line x1="112" y1="422" x2="1115" y2="422"/>
    <line x1="112" y1="356" x2="1115" y2="356" stroke-dasharray="4 7"/>
    <line x1="112" y1="290" x2="1115" y2="290" stroke-dasharray="4 7"/>
    <line x1="112" y1="224" x2="1115" y2="224" stroke-dasharray="4 7"/>
    <line x1="112" y1="158" x2="1115" y2="158" stroke-dasharray="4 7"/>
  </g>
  <g fill="#8b949e" font-family="Arial, sans-serif" font-size="13">
    <text x="44" y="426">0</text>
    <text x="30" y="360">₹10k</text>
    <text x="30" y="294">₹20k</text>
    <text x="30" y="228">₹30k</text>
    <text x="30" y="162">₹40k</text>
    <text x="108" y="452">Day 0</text>
    <text x="422" y="452">Day 30</text>
    <text x="756" y="452">Day 60</text>
    <text x="1070" y="452">Day 90</text>
  </g>
  <line x1="112" y1="356" x2="1115" y2="356" stroke="#f2cc60" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="924" y="344" fill="#f2cc60" font-family="Arial, sans-serif" font-size="14">Safety buffer</text>
  <path d="M112 213 L280 338 L447 318 L614 358 L781 332 L948 376 L1115 354" fill="none" stroke="#f85149" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 213 L280 262 L447 242 L614 279 L781 252 L948 294 L1115 266" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f85149">
    <circle cx="112" cy="213" r="5"/><circle cx="280" cy="338" r="5"/><circle cx="447" cy="318" r="5"/><circle cx="614" cy="358" r="5"/><circle cx="781" cy="332" r="5"/><circle cx="948" cy="376" r="5"/><circle cx="1115" cy="354" r="5"/>
  </g>
  <g fill="#3fb950">
    <circle cx="112" cy="213" r="5"/><circle cx="280" cy="262" r="5"/><circle cx="447" cy="242" r="5"/><circle cx="614" cy="279" r="5"/><circle cx="781" cy="252" r="5"/><circle cx="948" cy="294" r="5"/><circle cx="1115" cy="266" r="5"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="768" y="70" width="14" height="14" rx="3" fill="#f85149"/><text x="792" y="82" fill="#c9d1d9">Pay in full</text>
    <rect x="908" y="70" width="14" height="14" rx="3" fill="#3fb950"/><text x="932" y="82" fill="#c9d1d9">Installments</text>
  </g>
  <rect x="130" y="171" width="230" height="47" rx="8" fill="#238636" opacity="0.18" stroke="#3fb950"/>
  <text x="146" y="200" fill="#7ee787" font-family="Arial, sans-serif" font-size="14" font-weight="700">Installments preserve buffer</text>
</svg>